name: Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    name: Build installer
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust stable + Android target
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2

    - name: Install Inno Setup via Chocolatey
      run: choco install innosetup --yes --no-progress

    - name: Download Dokan Installer
      run: curl -L --retry 10 --retry-all-errors -o ./installer/Dokan_x64.msi https://github.com/dokan-dev/dokany/releases/download/v1.5.1.1000/Dokan_x64.msi

    - name: Patch Cargo.toml for sysinfo 0.26.4
      shell: pwsh
      run: |
        $lines = Get-Content Cargo.toml
        $lines = $lines | ForEach-Object {
          if ($_ -match '^\s*sysinfo\s*=') { 'sysinfo = "0.26.4"' } else { $_ }
        }
        Set-Content Cargo.toml -Value $lines -Encoding utf8
        Write-Host "=== Patched Cargo.toml ==="
        Get-Content Cargo.toml | Select-String "sysinfo"

    - name: Remove Cargo.lock to force re-resolution
      shell: pwsh
      run: if (Test-Path Cargo.lock) { Remove-Item Cargo.lock }

    - name: Install cargo-ndk (prebuilt binary)
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk

    - name: Verify cargo-ndk
      run: cargo ndk --version

    - name: Build Android server (arm64-v8a)
      run: cargo ndk -t arm64-v8a build --release --bin androidfs_server

    - name: Verify server binary exists
      shell: pwsh
      run: |
        $path = "target/aarch64-linux-android/release/androidfs_server"
        if (Test-Path $path) {
          Write-Host "OK: $path exists" -ForegroundColor Green
        } else {
          Write-Host "::error::$path not found"
          Get-ChildItem target -Recurse -Filter "androidfs_server*" -ErrorAction SilentlyContinue | Select-Object FullName
          exit 1
        }

    - name: Build Windows driver
      run: cargo build --release --bin androidfs_driver

    - name: Compile Installer
      run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /f installer/installer.iss'

    - name: Verify build artifacts
      shell: pwsh
      run: |
        $ok = $true
        if (Test-Path ./target/release/androidfs_driver.exe) {
          Write-Host "OK: androidfs_driver.exe found" -ForegroundColor Green
        } else {
          Write-Host "::error::androidfs_driver.exe not found"
          $ok = $false
        }
        if (Test-Path ./installer/*.exe) {
          Write-Host "OK: installer .exe found" -ForegroundColor Green
        } else {
          Write-Host "::error::installer .exe not found"
          $ok = $false
        }
        if (-not $ok) { exit 1 }

    - name: Upload standalone
      uses: actions/upload-artifact@v4
      with:
        name: standalone
        path: ./target/release/androidfs_driver.exe

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: ./installer/*.exe
