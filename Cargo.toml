[package]
name = "androidfs_driver"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Mount an Android device as a Windows drive over ADB"
readme = "README.md"

[dependencies]
bincode = "1.3.3"
byteorder = "1.5.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# windows-targets 0.48 only pulls this in for the exact x86_64-pc-windows-msvc triple;
# the x86_64-win7-windows-msvc build needs it for windows.0.48.5.lib.
windows_x86_64_msvc = "0.48.5"
dokan = "0.2.0"
env_logger = "0.11"
linked-hash-map = "0.5.6"
tempfile = "3"
widestring = "0.4.3"
winapi = { version = "0.3.9", features = ["fileapi", "minwindef", "minwinbase", "ntdef", "ntstatus", "sysinfoapi", "winbase", "wincon", "winnt", "winuser"] }
eframe = { version = "0.27.2", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "androidfs_server"
path = "src/bin/androidfs_server.rs"

[[bin]]
name = "androidfs_driver"
path = "src/bin/androidfs_driver.rs"
